<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

  <!-- Shield / Emblem Base -->
  <g filter="url(#shadow)">
    <!-- Worker Hard Hat & Wrench Emblem -->
    <!-- Hard Hat Crown -->
    <path d="M156 260 C156 160 356 160 356 260 Z" fill="#ffffff" />
    <!-- Hat Rim -->
    <rect x="136" y="254" width="240" height="26" rx="13" fill="#ffffff" />
    <!-- Center Ridge -->
    <path d="M242 168 C242 160 270 160 270 168 L266 254 L246 254 Z" fill="#f59e0b" opacity="0.9" />
    
    <!-- Crossed Tools underneath: Wrench and Hammer -->
    <!-- Crossed Wrench / Hammer silhouette below -->
    <g fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round">
      <!-- House / Geolocation Pin Outline Behind -->
      <path d="M256 90 L340 160 L320 160 L320 220 L192 220 L192 160 L172 160 Z" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.4" />
      <!-- Star / Checkmark of Quality -->
      <circle cx="256" cy="340" r="42" fill="#1c1917" />
      <!-- Checkmark -->
      <path d="M240 340 L252 352 L274 330" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
    </g>
    
    <!-- Text Badge "MULTIOFICIOS" -->
    <rect x="120" y="400" width="272" height="42" rx="21" fill="#1c1917" />
    <text x="256" y="427" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="3">MULTIOFICIOS</text>
  </g>
</svg>
